services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: php/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - "../:/var/www/html:ro"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_USERNAME: pos_local
      DB_PASSWORD: pos_codespace_only
      DB_DATABASE: pos
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pos
      MARIADB_USER: pos_local
      MARIADB_PASSWORD: pos_codespace_only
      MARIADB_ROOT_PASSWORD: pos_root_codespace_only
    volumes:
      - pos-db-data:/var/lib/mysql
      - "../database/schema.sql:/docker-entrypoint-initdb.d/01-pos-schema.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -ppos_root_codespace_only --silent"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pos-db-data:
