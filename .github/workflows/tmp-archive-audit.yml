name: Temporary POS archive database audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-archive-audit.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize database dump without outputting credentials or row values
        shell: bash
        run: |
          python - <<'PY'
          import io, zipfile, pathlib, re
          def count_rows(values):
              depth, quote, escaped, count = 0, None, False, 0
              for ch in values:
                  if quote:
                      if escaped: escaped = False
                      elif ch == "\\\\": escaped = True
                      elif ch == quote: quote = None
                      continue
                  if ch in ("'", '"', chr(96)):
                      quote = ch
                  elif ch == "(":
                      depth += 1
                      if depth == 1: count += 1
                  elif ch == ")":
                      depth = max(0, depth - 1)
              return count
          def summarize_sql(text, label):
              print("SQL_FILE", label)
              lines = text.splitlines()
              current = None
              cols = {}
              for line in lines:
                  clean = line.strip()
                  upper = clean.upper()
                  if upper.startswith("CREATE TABLE"):
                      parts = clean.replace("(", " ").split()
                      current = parts[2].strip(chr(96) + '"') if len(parts) > 2 else None
                      if current: cols[current] = []
                  elif current and clean.startswith(")") :
                      current = None
                  elif current and clean.startswith(chr(96)):
                      name = clean.split(chr(96))[1]
                      cols[current].append(name)
              for match in re.finditer(r"INSERT\\s+INTO\\s+([^\\s(]+)[\\s\\S]*?VALUES\\s*", text, re.I):
                  table = match.group(1).strip(chr(96) + '"')
                  start = match.end()
                  end = text.find(";", start)
                  values = text[start:end if end >= 0 else len(text)]
                  print("TABLE_DATA", table, "ROW_TUPLES", count_rows(values), "COLUMNS", cols.get(table, []))
          def walk(data, label, depth=0):
              if depth > 3: return
              z = zipfile.ZipFile(io.BytesIO(data))
              for info in z.infolist():
                  if info.is_dir(): continue
                  name = info.filename
                  if name.lower().endswith(".sql"):
                      summarize_sql(z.read(name).decode("utf-8","replace"), label + "!" + name)
                  elif name.lower().endswith(".zip"):
                      walk(z.read(name), label + "!" + name, depth+1)
          archive = pathlib.Path("UAS PEMWEB.zip")
          if archive.exists(): walk(archive.read_bytes(), str(archive))
          else: print("ARCHIVE_MISSING")
          PY
